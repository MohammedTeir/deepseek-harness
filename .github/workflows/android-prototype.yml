name: Android prototype
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/android/**', 'apps/web/**', 'packages/**', 'native/system/**', 'vendor/**', 'pnpm-lock.yaml', '.github/workflows/android-prototype.yml']
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:artifacts
      - run: pnpm run build:check
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: apps/android
      - run: python3 apps/android/tests/inspect_apk.py apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record source and APK hash
        run: |
          git rev-parse HEAD > apps/android/app/build/outputs/source.txt
          sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-prototype-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/source.txt
            apps/android/app/build/outputs/apk.sha256
            apps/android/app/build/reports/
          if-no-files-found: error
